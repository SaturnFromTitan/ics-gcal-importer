version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "ci"
    schedule:
      interval: quarterly
    cooldown:
      default-days: 3
    groups:
      github-actions-updates:
        patterns: ["*"]
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: quarterly
    cooldown:
      default-days: 3
    groups:
      uv-updates:
        patterns: ["*"]
