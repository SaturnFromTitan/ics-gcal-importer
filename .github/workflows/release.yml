name: Create Release

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci-checks:
    uses: $/.github/workflows/partial-ci-checks.yml

  release:
    runs-on: ubuntu-latest
    needs: ci-checks
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv (package manager)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Build extension
        run: uv build --wheel

      - name: Create Release # zizmor: ignore[superfluous-actions] Preserve release updates and asset replacement on reruns.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.ci-checks.outputs.version }}
          name: Release v${{ needs.ci-checks.outputs.version }}
          files: dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
