name: Create Release

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci-checks:
    uses: $/.github/workflows/partial-ci-checks.yml

  release:
    runs-on: ubuntu-latest
    needs: ci-checks
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up uv (package manager)
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Build extension
        run: uv build --wheel

      - name: Create Release # zizmor: ignore[superfluous-actions] Preserve release updates and asset replacement on reruns.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.ci-checks.outputs.version }}
          name: Release v${{ needs.ci-checks.outputs.version }}
          files: dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
