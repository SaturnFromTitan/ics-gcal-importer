name: Create Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci-checks:
    uses: $/.github/workflows/partial-ci-checks.yml

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: ci-checks
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv (package manager)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Bump release version
        id: version
        shell: bash
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          current_version=$(uv version --short)
          latest_tag=$(git tag --list 'v*' --sort=-version:refname | head -n1)

          if [ -n "$latest_tag" ] && [ "v$current_version" != "$latest_tag" ]; then
            echo "::error::Project version $current_version must match the latest tag $latest_tag before release."
            exit 1
          fi

          uv version --bump "$RELEASE_BUMP" --no-sync
          uv lock --check
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Build extension
        run: uv build --wheel

      - name: Commit and tag release version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml uv.lock
          git commit -m "chore(release): ${RELEASE_TAG}"
          git tag "${RELEASE_TAG}"
          gh auth setup-git
          git push --atomic origin HEAD:refs/heads/main "refs/tags/${RELEASE_TAG}"

      - name: Create Release # zizmor: ignore[superfluous-actions] Preserve release updates and asset replacement on reruns.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
